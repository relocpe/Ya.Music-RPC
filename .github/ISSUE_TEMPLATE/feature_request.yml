name: Идея
description: Хочется, чтобы приложение умело что-то ещё
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Что хочется
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем это нужно
      description: В какой ситуации не хватает.
